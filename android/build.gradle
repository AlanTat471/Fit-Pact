// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The project lives in a long OneDrive path. Windows then fails inside
// desugar_graph\...\dirs_bucket_* while building the release bundle.
// Build output goes to C:\numi-build instead. The app source stays where it is.
subprojects { subproject ->
    subproject.layout.buildDirectory.set(new File("C:/numi-build/${subproject.name}"))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
